services:
  - type: web
    name: saarthi-web
    env: docker
    region: oregon
    plan: free
    healthCheckPath: /api/dashboard/stats
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: saarthi-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: VAPI_API_KEY
        sync: false
      - key: SAARTHI_PHONE_NUMBER
        sync: false

databases:
  - name: saarthi-db
    databaseName: saarthi
    user: saarthi_user
    region: oregon
    plan: free
